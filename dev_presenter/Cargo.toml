[package]
name = "dev_presenter"
version = "0.0.1"
edition = "2024"

[dependencies]
dudes_in_space_api = { path = "../api" }
dudes_in_space_core = { path = "../core" }
dyn_serde = { path = "../dyn_serde" }
sdl2 = { version = "0.38.0", features = ["gfx", "ttf","image"] }
clap = { version = "4.5.43", features = ["derive"] }
serde = { version = "1.0", features = ["derive", "rc"] }
rand = "0.10.0"
serde_json = "1.0.140"
ctrlc = "3.5.2"

# fontconfig = "0.10.0"
# font-loader = "0.11.0"
fontique = "0.7.0"

aseprite = "0.1.3"
slint = "1.15.1"
burbomath = { git = "https://github.com/burbokop/burbomath.git" }

[build-dependencies]
slint-build = "1.15.1"

[features]
default = []
